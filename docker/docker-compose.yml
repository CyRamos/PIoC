version: '3.8'

services:
  pioc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pioc-platform
    ports:
      - "8501:8501"  # Streamlit GUI
      - "8000:8000"  # FastAPI backend
    environment:
      # Application settings
      - CTI_REQUIRE_AUTH=true
      - CTI_DEBUG=false
      - CTI_LOG_LEVEL=INFO
      # Server settings
      - STREAMLIT_SERVER_PORT=8501
      - API_PORT=8000
      # Optional: Override with your settings
      # - CTI_REQUIRE_AUTH=false  # Disable auth for development
    volumes:
      # Persist data and logs
      - pioc_data:/app/data
      - pioc_exports:/app/exports
      - pioc_uploads:/app/uploads
      - pioc_logs:/app/logs
      # Optional: Mount configuration from host
      # - ./config:/app/core/config
    networks:
      - pioc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: pioc-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - pioc
  #   networks:
  #     - pioc-network
  #   restart: unless-stopped

volumes:
  pioc_data:
    driver: local
  pioc_exports:
    driver: local
  pioc_uploads:
    driver: local
  pioc_logs:
    driver: local

networks:
  pioc-network:
    driver: bridge
