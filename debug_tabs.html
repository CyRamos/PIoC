<!DOCTYPE html>
<html>
<head>
    <title>Debug Tabs - PIoC API</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
    <style>
        .code-tabs {
            margin: 16px 0;
            border: 1px solid #e1e5e9;
            border-radius: 6px;
            overflow: hidden;
            background: white;
        }
        .tab-buttons {
            display: flex;
            background: #f7f7f7;
            border-bottom: 1px solid #e1e5e9;
        }
        .tab-button {
            padding: 10px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-right: 1px solid #e1e5e9;
            transition: all 0.2s;
        }
        .tab-button:last-child {
            border-right: none;
        }
        .tab-button.active {
            background: #61affe;
            color: white;
        }
        .tab-button:hover:not(.active) {
            background: #e8f4fd;
        }
        .tab-content {
            display: none;
            padding: 16px;
            background: #41444e;
            color: #f8f8f2;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        .tab-content.active {
            display: block;
        }
        .code-url {
            background: #272822;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 8px 0;
            word-break: break-all;
            border-left: 3px solid #61affe;
        }
        .live-url {
            color: #a6e22e;
            font-weight: bold;
        }
        .debug-info {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <h3>Debug Information</h3>
        <p>This page tests if the tabs work correctly. Open browser console (F12) to see debug messages.</p>
        <button onclick="testTabInjection()">Test Tab Injection</button>
        <button onclick="checkSwaggerElements()">Check Swagger Elements</button>
    </div>
    
    <div id="swagger-ui"></div>
    
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
    <script>
        function testTabInjection() {
            console.log('=== Testing Tab Injection ===');
            
            // Create a test tabs element
            const testDiv = document.createElement('div');
            testDiv.innerHTML = `
                <div class="code-tabs">
                    <div class="tab-buttons">
                        <button class="tab-button active" data-tab="unix-test">Unix/Linux</button>
                        <button class="tab-button" data-tab="ps-test">PowerShell</button>
                        <button class="tab-button" data-tab="py-test">Python</button>
                    </div>
                    <div class="tab-content active" id="unix-test">
                        <div class="code-url">Live URL: <span class="live-url">http://localhost:8000/api/v1/indicators</span></div>
                        <pre>curl -X GET "http://localhost:8000/api/v1/indicators" \\
  -H "Authorization: Bearer demo-token"</pre>
                    </div>
                    <div class="tab-content" id="ps-test">
                        <div class="code-url">Live URL: <span class="live-url">http://localhost:8000/api/v1/indicators</span></div>
                        <pre>curl -Uri 'http://localhost:8000/api/v1/indicators' \`
  -Headers @{'Authorization' = 'Bearer demo-token'}</pre>
                    </div>
                    <div class="tab-content" id="py-test">
                        <div class="code-url">Live URL: <span class="live-url">http://localhost:8000/api/v1/indicators</span></div>
                        <pre>import requests
headers = {"Authorization": "Bearer demo-token"}
response = requests.get("http://localhost:8000/api/v1/indicators", headers=headers)
print(response.json())</pre>
                    </div>
                </div>
            `;
            
            document.body.appendChild(testDiv.firstElementChild);
            
            // Add functionality
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetTabId = button.getAttribute('data-tab');
                    
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                    
                    button.classList.add('active');
                    const targetContent = document.querySelector('#' + targetTabId);
                    if (targetContent) {
                        targetContent.classList.add('active');
                    }
                });
            });
            
            console.log('Test tabs created!');
        }
        
        function checkSwaggerElements() {
            console.log('=== Checking Swagger Elements ===');
            console.log('Operations found:', document.querySelectorAll('.opblock').length);
            console.log('Operation summaries:', document.querySelectorAll('.opblock-summary').length);
            console.log('Expanded operations:', document.querySelectorAll('.opblock.is-open').length);
            
            document.querySelectorAll('.opblock-summary-path span').forEach((span, index) => {
                console.log(`Path ${index}:`, span.textContent);
            });
        }
        
        window.onload = function() {
            console.log('=== Initializing Swagger UI ===');
            
            const ui = SwaggerUIBundle({
                url: '/openapi.json',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                onComplete: function() {
                    console.log('Swagger UI loaded, waiting before checking for tabs...');
                    setTimeout(() => {
                        console.log('=== Starting tab injection ===');
                        initializeCodeTabs();
                    }, 2000);
                }
            });
        };
        
        function initializeCodeTabs() {
            console.log('Initializing code tabs...');
            
            // Add click listeners to all operation summaries
            document.addEventListener('click', function(event) {
                const opblockSummary = event.target.closest('.opblock-summary');
                if (opblockSummary) {
                    console.log('Operation clicked:', opblockSummary);
                    setTimeout(() => {
                        addTabsToExpandedOperation(opblockSummary);
                    }, 300);
                }
            });
            
            // Try to add tabs to any already expanded operations
            setTimeout(() => {
                const expandedOps = document.querySelectorAll('.opblock.is-open');
                console.log('Found expanded operations:', expandedOps.length);
                expandedOps.forEach(addTabsToExpandedOperation);
            }, 500);
        }
        
        function addTabsToExpandedOperation(operationElement) {
            const operation = operationElement.closest ? operationElement.closest('.opblock') : operationElement;
            if (!operation) {
                console.log('No operation found');
                return;
            }
            
            // Check if tabs already exist
            if (operation.querySelector('.code-tabs')) {
                console.log('Tabs already exist for this operation');
                return;
            }
            
            // Get the endpoint path
            const pathSpan = operation.querySelector('.opblock-summary-path span');
            const path = pathSpan ? pathSpan.textContent.trim() : '';
            
            console.log('Processing operation with path:', path);
            
            // Only add tabs to indicator/statistics endpoints
            if (!path.includes('/indicators') && !path.includes('/statistics')) {
                console.log('Skipping non-indicator endpoint:', path);
                return;
            }
            
            // Find the operation body
            const opblockBody = operation.querySelector('.opblock-body');
            if (!opblockBody) {
                console.log('No operation body found');
                return;
            }
            
            console.log('Adding tabs to operation:', path);
            
            // Create tabs HTML
            const operationId = 'tab_' + Math.random().toString(36).substr(2, 9);
            const baseUrl = window.location.origin;
            
            const tabsHTML = `
                <div class="code-tabs" style="margin: 16px 0;">
                    <div class="tab-buttons">
                        <button class="tab-button active" data-tab="unix-${operationId}">Unix/Linux</button>
                        <button class="tab-button" data-tab="ps-${operationId}">PowerShell</button>
                        <button class="tab-button" data-tab="py-${operationId}">Python</button>
                    </div>
                    <div class="tab-content active" id="unix-${operationId}">
                        <div class="code-url">Live URL: <span class="live-url">${baseUrl}${path}</span></div>
                        <pre>curl -X GET "${baseUrl}${path}" \\
  -H "Authorization: Bearer demo-token"</pre>
                    </div>
                    <div class="tab-content" id="ps-${operationId}">
                        <div class="code-url">Live URL: <span class="live-url">${baseUrl}${path}</span></div>
                        <pre>curl -Uri '${baseUrl}${path}' \`
  -Headers @{'Authorization' = 'Bearer demo-token'}</pre>
                    </div>
                    <div class="tab-content" id="py-${operationId}">
                        <div class="code-url">Live URL: <span class="live-url">${baseUrl}${path}</span></div>
                        <pre>import requests
headers = {"Authorization": "Bearer demo-token"}
response = requests.get("${baseUrl}${path}", headers=headers)
print(response.json())</pre>
                    </div>
                </div>
            `;
            
            // Insert tabs
            const tabsContainer = document.createElement('div');
            tabsContainer.innerHTML = tabsHTML;
            opblockBody.insertBefore(tabsContainer.firstElementChild, opblockBody.firstChild);
            
            // Add tab functionality
            const tabButtons = operation.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetTabId = button.getAttribute('data-tab');
                    
                    operation.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                    operation.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                    
                    button.classList.add('active');
                    const targetContent = operation.querySelector('#' + targetTabId);
                    if (targetContent) {
                        targetContent.classList.add('active');
                    }
                });
            });
            
            console.log('Tabs successfully added to:', path);
        }
    </script>
</body>
</html>
