# Render Blueprint for PIoC Platform
# This file ensures proper Python version and deployment configuration

services:
  - type: web
    name: PIoC-Platform
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements/requirements.txt
    startCommand: python -m streamlit run src/pioc/gui_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PORT
        sync: false
      - key: PYTHONPATH
        value: "."
      - key: CTI_REQUIRE_AUTH
        value: "true"
      - key: CTI_DEBUG
        value: "false"
      - key: CTI_LOG_LEVEL
        value: "INFO"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RENDER_DEPLOYMENT
        value: "true"
    autoDeploy: true
